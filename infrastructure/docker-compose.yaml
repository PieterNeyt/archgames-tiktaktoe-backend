version: '3.9'

name: tic-tac-toe

services:
  game_postgres:
    image: postgres:17.1-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ttt
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5444:5432"
